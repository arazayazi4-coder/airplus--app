<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>حساب تولید شاتون و سیلندر</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#17212B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="حساب تولید">
<style>
:root{--bg:#E9ECEF;--panel:#fff;--ink:#17212B;--mut:#5C6873;--line:#D3D9DF;--soft:#F3F5F7;--blue:#1F4E9C;--blue-d:#173B78;--blue-s:#E4ECF8;--good:#1B7A53;--bad:#B3342B;--warn:#9A6412;--warn-s:#FFF3D6}
*{box-sizing:border-box}
body{margin:0;font-family:Vazirmatn,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.6;
 padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,select{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
aside{background:#17212B;color:#DCE3EA;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:20px 0}
.brand{padding:0 20px 12px;border-bottom:1px solid #2B3947;margin-bottom:6px}
.brand b{display:block;font-size:17px;color:#fff}
.brand span{font-size:12px;color:#8FA0B2}
.who{padding:8px 20px 12px;border-bottom:1px solid #2B3947;margin-bottom:6px;font-size:12px;color:#9FB0C2}
.who .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-inline-end:6px}
.who .on{background:#3FBF7F}.who .off{background:#D3A83C}
nav{flex:1;overflow:auto}
nav button{display:block;width:100%;text-align:right;background:none;border:0;border-inline-start:3px solid transparent;padding:10px 20px;color:#C3CDD8;cursor:pointer}
nav button:hover{background:#1F2C39}
nav button.on{background:#1F2C39;color:#fff;border-inline-start-color:#5C93E6;font-weight:700}
.tools{padding:12px 16px 0;border-top:1px solid #2B3947;display:grid;gap:6px}
.tools button{background:#22303E;border:1px solid #33455A;color:#C9D3DE;border-radius:6px;padding:7px 10px;cursor:pointer;font-size:12.5px}
.tools button:hover{background:#2B3D50}
main{padding:24px 28px 60px;min-width:0}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--mut);margin:0 0 18px}
.bar{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
.btn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:8px 14px;cursor:pointer}
.btn:hover{background:var(--soft)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700}
.btn.pri:hover{background:var(--blue-d)}
.btn.sm{padding:3px 9px;font-size:12.5px}
.btn.del{color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.wrap{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:auto;max-height:70vh}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th{position:sticky;top:0;background:#F0F3F6;text-align:right;font-weight:700;font-size:12.5px;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:1}
td{padding:8px 12px;border-bottom:1px solid #E8ECF0;white-space:nowrap}
tr:hover td{background:#FAFBFC}
tfoot td{font-weight:700;background:#F0F3F6;position:sticky;bottom:0;border-top:1px solid var(--line)}
td.n{text-align:left}
th.n{text-align:left}
.neg{color:var(--bad)}
.pos{color:var(--good)}
.mut{color:var(--mut)}
.empty{padding:40px 20px;text-align:center;color:var(--mut)}
.split{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px;align-items:start}
.sect{margin:26px 0 8px;font-size:15px;font-weight:700}
.ledger{background:#fff;border:1px solid var(--line);border-radius:8px}
.ledger div{display:flex;justify-content:space-between;gap:16px;padding:10px 16px;border-bottom:1px solid #E8ECF0}
.ledger div:last-child{border-bottom:0}
.ledger .key{background:var(--blue-s);font-weight:700}
.ledger .big{font-size:20px;font-weight:700;padding:16px}
.ledger b{font-variant-numeric:tabular-nums}
.shares{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.share{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.share span{color:var(--mut);font-size:12.5px}
.share b{display:block;font-size:18px;font-variant-numeric:tabular-nums}
.bars{background:#fff;border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.bars h3{margin:0 0 10px;font-size:14px}
.brow{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:center;margin-bottom:12px}
.brow .b{height:9px;border-radius:2px;margin:3px 0;min-width:2px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mut);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-inline-end:5px}
.alert{background:var(--warn-s);border:1px solid #E9CE8B;color:var(--warn);border-radius:8px;padding:10px 14px;margin-bottom:10px}
.alert.info{background:var(--blue-s);border-color:#B9CDED;color:var(--blue-d)}
.alert .btn{margin-inline-start:8px}
dialog{border:0;border-radius:10px;padding:0;width:min(640px,94vw);box-shadow:0 20px 60px rgba(10,20,30,.35)}
dialog::backdrop{background:rgba(15,25,35,.5)}
.dh{padding:16px 20px;border-bottom:1px solid var(--line);font-weight:700;font-size:16px}
.db{padding:18px 20px;display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;max-height:66vh;overflow:auto}
.fld{display:grid;gap:4px}
.fld.wide{grid-column:1/-1}
.fld span{font-size:12.5px;color:var(--mut)}
.fld small{color:var(--mut);font-size:11.5px}
.fld input,.fld select,.sset input,.sset select{border:1px solid #BAC3CC;border-radius:6px;padding:8px 10px;background:#fff;width:100%}
.fld input:focus,.fld select:focus,.sset input:focus,.sset select:focus{outline:2px solid #5C93E6;outline-offset:0;border-color:#5C93E6}
.prev{grid-column:1/-1;background:var(--soft);border:1px dashed #B8C2CC;border-radius:8px;padding:10px 14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px 16px}
.prev span{color:var(--mut);font-size:12px;display:block}
.prev b{font-variant-numeric:tabular-nums}
.err{grid-column:1/-1;color:var(--bad);font-weight:700}
.df{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-start}
.sset{background:#fff;border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:16px}
.sset table td,.sset table th{padding:6px 8px;background:none;position:static}
.sset table input{min-width:90px}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#17212B;color:#fff;padding:10px 18px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
#toast.show{opacity:1}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;background:var(--blue-s);color:var(--blue-d);font-weight:700}
.badge.limited{background:var(--warn-s);color:var(--warn)}
.badge.admin{background:#E1F3EA;color:var(--good)}
/* invoice */
.inv-sheet{padding:18px 6px;font-size:13px;color:#111}
.inv-head{display:flex;justify-content:space-between;gap:14px;border-bottom:2px solid #17212B;padding-bottom:12px;margin-bottom:16px}
.inv-co-name{font-size:20px;font-weight:700}
.inv-co-meta{font-size:12px;color:#555;margin-top:4px}
.inv-title{text-align:left;font-weight:700;line-height:1.9}
.inv-title span{display:block;font-weight:400;font-size:12.5px;color:#444}
.inv-buyer{background:#F3F5F7;padding:9px 12px;border-radius:6px;margin-bottom:14px}
.inv-table{width:100%;border-collapse:collapse;margin-bottom:14px}
.inv-table th,.inv-table td{border:1px solid #bbb;padding:8px;text-align:center;font-size:12.5px}
.inv-table tfoot td{font-weight:700;background:#F3F5F7}
.inv-words{margin-bottom:16px;font-size:12.5px}
.inv-note{margin-bottom:16px;font-size:12px;color:#555;white-space:pre-wrap}
.inv-sign{display:flex;gap:16px;margin-top:34px}
.inv-sign .box{flex:1;border:1px dashed #999;border-radius:8px;height:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#555;font-size:12.5px}
.inv-sign .stamp{margin-top:8px;color:#999;font-size:11.5px}
.menubtn{display:none;background:#22303E;border:1px solid #33455A;color:#DCE3EA;border-radius:6px;padding:7px 12px;font-size:16px;cursor:pointer;line-height:1}
@media(max-width:860px){
 .app{grid-template-columns:1fr}
 aside{position:sticky;top:0;z-index:20;height:auto;padding:0}
 .brand{display:flex;justify-content:space-between;align-items:center;padding:12px 16px}
 .menubtn{display:inline-flex}
 .who,nav,.tools{display:none}
 aside.open .who{display:block;padding:8px 16px 12px;border-bottom:1px solid #2B3947}
 aside.open nav{display:block;max-height:55vh;overflow:auto}
 nav button{width:100%;border-inline-start:0;border-bottom:1px solid #2B3947;padding:13px 16px;text-align:right}
 aside.open .tools{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;padding:10px 16px 14px}
 main{padding:14px 12px 50px}
 .split{grid-template-columns:1fr}
 .db{grid-template-columns:1fr}
}
th .flt{display:block;width:100%;min-width:64px;margin-top:5px;padding:3px 6px;font-size:12px;font-weight:400;border:1px solid #BAC3CC;border-radius:4px;background:#fff;color:var(--ink)}
.fbar{min-height:8px;font-size:12.5px;margin:0 0 6px}
@media print{
 body *{visibility:hidden}
 #dlg,#dlg *{visibility:visible}
 #dlg{position:fixed;inset:0;margin:0;max-width:none;width:100%;height:100%;border-radius:0;box-shadow:none;padding:0}
 .no-print{display:none!important}
}
@media(prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<div class="app">
 <aside>
  <div class="brand"><div><b>حساب تولید</b><span>شاتون و سیلندر کمپرسور باد</span><span style="display:block;font-size:10px;color:#5C93E6;margin-top:2px">نسخه ۱۴۰۵/۰۷/۱۲-۲</span></div><button id="menuBtn" class="menubtn">☰</button></div>
  <div class="who" id="who"></div>
  <nav id="nav"></nav>
  <div class="tools" id="tools"></div>
 </aside>
 <main id="main"></main>
</div>
<dialog id="dlg"></dialog>
<div id="toast"></div>
<input type="file" id="file" accept=".json" hidden>

<script>
/* ======== ابزارهای پایه ======== */
const fa=new Intl.NumberFormat('fa-IR',{maximumFractionDigits:0});
const fa2=new Intl.NumberFormat('fa-IR',{maximumFractionDigits:2});
const faP=new Intl.NumberFormat('fa-IR',{maximumFractionDigits:1,style:'percent'});
const FD='۰۱۲۳۴۵۶۷۸۹';
const faDigits=s=>String(s??'').replace(/\d/g,d=>FD[d]);
const latin=s=>String(s??'').replace(/[۰-۹]/g,d=>FD.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));
const num=v=>{if(v===''||v==null)return 0;if(typeof v==='number')return v;const s=latin(v).replace(/[,،٬\s]/g,'').replace('٫','.');const n=parseFloat(s);return isNaN(n)?0:n};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(3,'0');
const pad4=n=>String(n).padStart(4,'0');
function g2j(gy,gm,gd){const gdm=[0,31,59,90,120,151,181,212,243,273,304,334];let jy=gy>1600?979:0;gy-=gy>1600?1600:621;const gy2=gm>2?gy+1:gy;let days=365*gy+parseInt((gy2+3)/4)-parseInt((gy2+99)/100)+parseInt((gy2+399)/400)-80+gd+gdm[gm-1];jy+=33*parseInt(days/12053);days%=12053;jy+=4*parseInt(days/1461);days%=1461;if(days>365){jy+=parseInt((days-1)/365);days=(days-1)%365}const jm=days<186?1+parseInt(days/31):7+parseInt((days-186)/30);const jd=1+(days<186?days%31:(days-186)%30);return[jy,jm,jd]}
function todayJ(){const d=new Date();const[y,m,dd]=g2j(d.getFullYear(),d.getMonth()+1,d.getDate());return`${y}/${String(m).padStart(2,'0')}/${String(dd).padStart(2,'0')}`}
function normDate(s){const m=latin(s).trim().match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})$/);if(!m)return null;const[,y,mo,d]=m;if(+mo<1||+mo>12||+d<1||+d>31)return null;return`${y}/${mo.padStart(2,'0')}/${d.padStart(2,'0')}`}
function tsToStr(ms){if(!ms)return'—';const d=new Date(ms);const[jy,jm,jd]=g2j(d.getFullYear(),d.getMonth()+1,d.getDate());const hh=String(d.getHours()).padStart(2,'0'),mi=String(d.getMinutes()).padStart(2,'0');return faDigits(`${jy}/${String(jm).padStart(2,'0')}/${String(jd).padStart(2,'0')} ${hh}:${mi}`)}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2600)}
function deepMerge(base,over){if(Array.isArray(base))return over!==undefined?over:base;if(base&&typeof base==='object'){const o={...base};if(over&&typeof over==='object')for(const k in base)o[k]=deepMerge(base[k],over[k]);return o}return over!==undefined?over:base}

/* Persian number to words */
const ONES=['','یک','دو','سه','چهار','پنج','شش','هفت','هشت','نه'];
const TEEN=['ده','یازده','دوازده','سیزده','چهارده','پانزده','شانزده','هفده','هجده','نوزده'];
const TENS=['','','بیست','سی','چهل','پنجاه','شصت','هفتاد','هشتاد','نود'];
const HUND=['','صد','دویست','سیصد','چهارصد','پانصد','ششصد','هفتصد','هشتصد','نهصد'];
const SCALE=['','هزار','میلیون','میلیارد','تریلیون'];
function threeWords(n){if(n===0)return'';const h=Math.floor(n/100),r=n%100;const parts=[];if(h)parts.push(HUND[h]);if(r){if(r<10)parts.push(ONES[r]);else if(r<20)parts.push(TEEN[r-10]);else{const t=Math.floor(r/10),o=r%10;parts.push(TENS[t]+(o?' و '+ONES[o]:''))}}return parts.join(' و ')}
function toWordsFa(n){n=Math.round(Math.abs(n));if(n===0)return'صفر';const groups=[];while(n>0){groups.push(n%1000);n=Math.floor(n/1000)}const parts=[];for(let i=groups.length-1;i>=0;i--){if(!groups[i])continue;const w=threeWords(groups[i]);parts.push(w+(SCALE[i]?' '+SCALE[i]:''))}return parts.join(' و ')}

function download(name,text,mime){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:mime}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
const csvCell=x=>{x=x==null?'':String(x);return/[",\n]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x};
async function saveFile(name,text,mime){
 if(MODE==='claude'&&CAP.downloads){try{await CAP.downloads.save({filename:name,data:text});toast('فایل ذخیره شد')}catch(e){if(e&&e.code!=='declined')toast('ذخیره فایل ممکن نشد')}return}
 download(name,text,mime);
}

/* ======== لایه ذخیره‌سازی: آنلاین (چند‌گوشی) یا محلی (همین مرورگر) ======== */
const LOCAL_KEY='shaton-app-v2';
const LEGACY_KEY='shaton-app-v1';
let MODE='local';
let CAP={};
let FB={};
let CUR={id:'local',name:'',isOwner:true,canEdit:true};
let profileCache={};
let importOffer=null;
const isOnline=()=>MODE==='firebase'||MODE==='claude';
function ensureIdentity(){
 let id=localStorage.getItem('shaton-uid');
 if(!id){id=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():localUid();localStorage.setItem('shaton-uid',id)}
 CUR.id=id;CUR.name=localStorage.getItem('shaton-uname')||'';
}

function defaultSettings(){return{count:3,names:['','',''],
 materials:[{id:'m1',name:'شفت توپر ۷۰۰۰ - Ø45',od:45,idm:0,density:2.8,unit:'kg'},{id:'m2',name:'لوله ۶۰۰۰ - Ø60/Ø30',od:60,idm:30,density:2.7,unit:'kg'}],
 products:[{id:'p1',name:'شاتون',materialId:'m1',length:120,waste:3,salePrice:0},{id:'p2',name:'سیلندر تیپ ۱',materialId:'m2',length:100,waste:3,salePrice:0},{id:'p3',name:'سیلندر تیپ ۲',materialId:'m2',length:80,waste:3,salePrice:0}],
 company:{name:'ایرپلاس پنوماتیک',address:'',phone:'',eco:'',bank:'',note:''}}}
function defaultsState(){return{settings:defaultSettings(),purchases:[],batches:[],sales:[],buyers:[],activity:[],members:[],roles:{},ledger:[],stockout:[],counters:{p:0,t:0}}}
let state=defaultsState();
const S=()=>state.settings;
const localUid=()=>'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);

function loadLocal(){try{const raw=localStorage.getItem(LOCAL_KEY);if(raw){const d=JSON.parse(raw);state=Object.assign(defaultsState(),d);state.settings=deepMerge(defaultSettings(),d.settings||{})}}catch(e){}}
function saveLocal(){try{localStorage.setItem(LOCAL_KEY,JSON.stringify(state))}catch(e){toast('ذخیره در مرورگر ممکن نشد')}}

/* کد پارت/بچ: به‌صورت شمارنده امن حتی با چند کاربر هم‌زمان */
async function nextCode(prefix,field){
 if(MODE==='local'){state.counters[field]=(state.counters[field]||0)+1;saveLocal();return prefix+pad(state.counters[field])}
 if(MODE==='firebase'){
  const ref=FB.mod.doc(FB.db,'app/counters');
  const next=await FB.mod.runTransaction(FB.db,async(tx)=>{
   const snap=await tx.get(ref);
   const data=snap.exists()?snap.data():{};
   const n=(data[field]||0)+1;
   tx.set(ref,{...data,[field]:n});
   return n;
  });
  return prefix+pad(next);
 }
 const ref=CAP.db.doc('app/counters');
 for(let i=0;i<5;i++){
  try{
   const lease=await ref.acquire({holder:CUR.id||localUid(),ttlMs:4000});
   if(lease.acquired){
    const snap=await ref.get();
    const data=snap.data()||{};
    const next=(data[field]||0)+1;
    await ref.set({...data,[field]:next});
    return prefix+pad(next);
   }
  }catch(e){}
  await new Promise(r=>setTimeout(r,300+i*200));
 }
 return prefix+pad4(Date.now()%10000);
}

async function addDoc(col,data){
 if(isOnline()){const ref=await CAP.db.collection(col).add({...data,createdAt:Date.now(),by:CUR.id});return ref.id}
 const id=localUid();state[col].push({id,...data,createdAt:Date.now(),by:CUR.id});saveLocal();render();return id;
}
async function setDoc(col,id,data){
 if(isOnline()){await CAP.db.doc(col+'/'+id).set({...data,updatedAt:Date.now(),by:CUR.id})}
 else{const row=state[col].find(r=>r.id===id);if(row)Object.assign(row,data,{updatedAt:Date.now(),by:CUR.id});saveLocal();render()}
}
async function delDoc(col,id){
 if(isOnline()){await CAP.db.doc(col+'/'+id).delete()}
 else{state[col]=state[col].filter(r=>r.id!==id);saveLocal();render()}
}
async function saveSettings(){
 if(isOnline()){await CAP.db.doc('app/settings').set(state.settings)}
 else{saveLocal();render()}
}
async function logActivity(action){
 const entry={actorId:CUR.id||'local',action,ts:Date.now()};
 if(isOnline()){CAP.db.collection('activity').add(entry).catch(()=>{})}
 else{entry.id=localUid();state.activity.unshift(entry);if(state.activity.length>300)state.activity.length=300;saveLocal()}
}
async function resolveProfiles(ids){
 const missing=[...new Set(ids)].filter(id=>id&&!(id in profileCache));
 if(!missing.length)return;
 if(MODE!=='claude'||!CAP.user){missing.forEach(id=>profileCache[id]={name:''});return}
 try{const res=await CAP.user.profiles(missing);Object.assign(profileCache,res);render()}catch(e){}
}
function nameOf(id){
 if(id===CUR.id)return CUR.name||'شما';
 if(MODE==='firebase'){const m=state.members.find(x=>x.id===id);return(m&&m.name)||'کاربر ناشناس'}
 const p=profileCache[id];return(p&&p.name)||'—'
}

/* ======== محاسبات کسب‌وکار ======== */
const UNKNOWN_MAT={id:'',name:'⚠️ متریال نامشخص',od:0,idm:0,density:0,unit:'kg'};
const mat=id=>S().materials.find(m=>m.id===id)||UNKNOWN_MAT;
function orphanedMaterialIds(){

const pCalc=p=>{const mt=p.kg*p.price,total=mt+(p.transport||0);return{mt,total,perKg:p.kg>0?total/p.kg:0}};
const weightOf=b=>{const p=prod(b.productId);if(!p)return 0;return b.actualKg>0?b.actualKg:b.qty*unitWeight(p)*(1+(p.waste||0)/100)};
const COSTS=[['machining','ماشینکاری / تراشکاری'],['bearing','بلبرینگ'],['screw','پیچ'],['anodize','انادایز'],['polish','ویبره و پولیش'],['laser','لیزر'],['other','سایر اقلام (ورق، پکینگ، واشر و…)']];
const CASHLESS=new Set(['bearing','screw','other']);
function bCalc(b){const part=state.purchases.find(x=>x.code===b.partCode);const w=weightOf(b);const perKg=part?pCalc(part).perKg:0;const matCost=w*perKg;const proc=COSTS.reduce((a,[k])=>a+(b[k]||0),0);const unitMat=b.qty>0?matCost/b.qty:0;const rawUnit=unitMat+proc;const scrap=Math.min(Math.max(b.scrap||0,0),b.qty);const usable=b.qty-scrap;const total=rawUnit*b.qty;const unit=usable>0?total/usable:0;const sold=state.sales.filter(s=>s.batchCode===b.code).reduce((a,s)=>a+s.qty,0);const stock=usable-sold;const procCash=COSTS.filter(([k])=>!CASHLESS.has(k)).reduce((a,[k])=>a+(b[k]||0),0);return{w,perKg,matCost,proc,procCash,unitMat,rawUnit,unit,scrap,usable,total,procTotal:proc*b.qty,procCashTotal:procCash*b.qty,sold,stock,stockVal:stock*unit}}
const EXCL_FIELDS=[['bearing','بلبرینگ'],['screw','پیچ'],['other','سایر اقلام']];
function defaultTypes(p){

function unitFor(b,c,excl){
 if(!c.usable)return 0;
 let sub=0;for(const k of(excl||[]))sub+=(b[k]||0)*b.qty/c.usable;
 return Math.max(0,c.unit-sub);
}
function sCalc(s){
 const b=state.batches.find(x=>x.code===s.batchCode);
 const c=b?bCalc(b):null;
 const t=b?saleType(b.productId,s.typeId):null;
 const unit=c?unitFor(b,c,t&&t.excl):0;
 const total=s.qty*s.price,cogs=s.qty*unit;
 return{b,unit,total,cogs,profit:total-cogs,margin:total?(total-cogs)/total:0,typeName:t?t.name:''};
}
const usedKg=(code,except)=>state.batches.filter(b=>b.partCode===code&&b.id!==except).reduce((a,b)=>a+weightOf(b),0)+state.stockout.filter(x=>x.partCode===code).reduce((a,x)=>a+(+x.qty||0),0);

function settlements(){return state.ledger.filter(x=>x.kind==='settlement').sort((a,b)=>(a.date||'').localeCompare(b.date||'')||(a.createdAt||0)-(b.createdAt||0))}
function lastSettleDate(){const l=settlements();return l.length?l[l.length-1].date:''}
function totals(){
 const purch=state.purchases.reduce((a,p)=>a+pCalc(p).total,0);
 const sales=state.sales.reduce((a,s)=>a+s.qty*s.price,0);
 const proc=state.batches.reduce((a,b)=>a+bCalc(b).procTotal,0);
 const procCash=state.batches.reduce((a,b)=>a+bCalc(b).procCashTotal,0);
 const stockVal=state.batches.reduce((a,b)=>a+bCalc(b).stockVal,0);
 const profit=state.sales.reduce((a,s)=>a+sCalc(s).profit,0);
 const capital=ledgerSum(x=>x.kind==='capital');
 const withdrawn=ledgerSum(x=>x.kind==='withdraw'||x.kind==='settle');
 const rawVal=state.purchases.reduce((a,p)=>{const rem=p.kg-usedKg(p.code);return a+(rem>0?rem*pCalc(p).perKg:0)},0);
 return{purch,sales,proc,procCash,capital,withdrawn,cash:capital+sales-purch-procCash-withdrawn,stockVal,rawVal,profit}}
function partnerStats(){
 const n=nSh();const t=totals();const ls=lastSettleDate();
 const periodProfit=state.sales.filter(s=>!ls||(s.date||'')>ls).reduce((a,s)=>a+sCalc(s).profit,0);
 const rows=[];
 for(let i=0;i<n;i++){
  const capital=ledgerSum(x=>x.kind==='capital'&&String(x.sh)===String(i));
  const withdraw=ledgerSum(x=>(x.kind==='withdraw'||x.kind==='settle')&&String(x.sh)===String(i));
  const share=t.profit/n;const remainProfit=share-withdraw;
  rows.push({i,name:shName(i),capital,share,withdraw,remainProfit,balance:capital+remainProfit,periodShare:periodProfit/n});
 }
 return{rows,n,periodProfit,lastSettle:ls};
}
function settlePreview(D){
 const n=nSh();
 const profitTo=state.sales.filter(s=>(s.date||'')<=D).reduce((a,s)=>a+sCalc(s).profit,0);
 const out=[];
 for(let i=0;i<n;i++){
  const share=profitTo/n;
  const wd=ledgerSum(x=>(x.kind==='withdraw'||x.kind==='settle')&&String(x.sh)===String(i)&&(x.date||'')<=D);
  const claim=share-wd;
  out.push({i,name:shName(i),share,wd,claim,pay:Math.max(0,Math.round(claim))});
 }
 return{profitTo,rows:out,total:out.reduce((a,r)=>a+r.pay,0)};
}

function cmpOp(op,a,b){switch(op){case'>':return a>b;case'<':return a<b;case'>=':return a>=b;case'<=':return a<=b;default:return a===b}}
function matchFilter(col,raw,q,mode){
 if(mode==='eq')return String(raw??'')===q;
 q=String(q).trim();if(!q)return true;
 const m=q.match(/^(>=|<=|>|<|=)\s*(.*)$/);
 if(m){
  const op=m[1],rhs=latin(m[2]).trim();if(!rhs)return true;
  if(isNumCol(col)){let a=Number(raw);if(col.k==='pct')a*=100;const b=parseFloat(rhs.replace(/[,،٬]/g,''));if(isNaN(b))return true;if(raw===''||raw==null||isNaN(a))return false;return cmpOp(op,a,b)}
  const a=latin(String(raw??''));const b=col.k==='date'?(normDate(rhs)||rhs):rhs;
  if(!a)return false;
  return op==='='?a===b:cmpOp(op,a,b);
 }
 let qq=latin(q).toLowerCase();if(isNumCol(col))qq=qq.replace(/[,،٬]/g,'');
 return latin(String(raw??'')).toLowerCase().includes(qq);
}

async function doSettle(){
 if(!guardEdit())return;
 const D=normDate(($('#setdate')||{}).value||'');if(!D){$('#seterr').textContent='تاریخ معتبر نیست.';return}
 const p=settlePreview(D);

 const grp=Date.now().toString(36);
 try{
  for(const r of p.rows)if(r.pay>0)await addDoc('ledger',{date:D,sh:String(r.i),kind:'settle',amount:r.pay,note:'تسویه سود تا '+D,grp});
  await addDoc('ledger',{date:D,sh:'',kind:'settlement',amount:p.total,profitTo:Math.round(p.profitTo),grp,note:''});
  logActivity(`تسویه حساب با سهامداران تا تاریخ ${D} به مبلغ ${fa.format(p.total)}`);
  $('#dlg').close();toast('تسویه ثبت شد');render();
 }catch(e){$('#seterr').textContent='ثبت ناموفق بود: '+((e&&(e.code||e.message))||e)}
}
async function cancelSettle(id){
 const m=state.ledger.find(x=>x.id===id);if(!m||!guardEdit())return;
 if(!confirm('این تسویه لغو شود؟ پرداخت‌های ثبت‌شده‌ی همین تسویه هم حذف می‌شوند.'))return;
 try{
  const list=state.ledger.filter(x=>x.grp===m.grp&&x.kind==='settle');
  for(const x of list)await delDoc('ledger',x.id);
  await delDoc('ledger',m.id);
  logActivity('لغو تسویه حساب تاریخ '+m.date);render();toast('تسویه لغو شد');
 }catch(e){toast('لغو ناموفق بود: '+((e&&(e.code||e.message))||e))}
}

let cur=null;

 if(f.t==='select')inp=`<select id="${id}" name="${f.k}">${f.opts(vals).map(o=>`<option value="${esc(o.v)}"${o.v===v?' selected':''}>${esc(o.l)}</option>`).join('')}</select>`;

function readForm(fields){const v={};for(const f of fields){const el=$('#dlg [name="'+f.k+'"]');let x=el?el.value:'';if(f.t==='num')x=num(x);else if(f.t==='date')x=normDate(x)||'';v[f.k]=x}return v}
function openForm(key,id,preset){
 if(!guardEdit())return;
 const E=ENT[key];const row=id?state[key].find(r=>r.id===id):null;
 const vals=row?{...row}:E.blank(preset);

 $('#dlg').innerHTML=`<div class="dh">${row?'ویرایش':'ثبت'} ${E.one}</div><div class="db">${fields.map(f=>fieldHTML(f,vals[f.k],vals)).join('')}<div class="prev" id="prev" hidden></div><div class="err" id="err"></div></div><div class="df"><button class="btn pri" data-act="submit">ذخیره</button><button class="btn" data-act="cancel">انصراف</button></div>`;
 $('#dlg').showModal();refreshForm();
 const first=$('#dlg input,#dlg select');if(first)first.focus();

function refreshForm(){
 if(!cur)return;const{key,row,fields}=cur;
 if(key==='sales'){
  const bsel=$('#dlg [name="batchCode"]'),tsel=$('#dlg [name="typeId"]');
  if(bsel&&tsel){const b=state.batches.find(x=>x.code===bsel.value);const opts=b?typesOf(b.productId):[];const sig=opts.map(o=>o.id).join('|');
   if(tsel.dataset.sig!==sig){const want=tsel.value;tsel.innerHTML=opts.map(t=>`<option value="${esc(t.id)}">${esc(t.name)}</option>`).join('');tsel.value=opts.some(t=>t.id===want)?want:(opts[0]?opts[0].id:'');tsel.dataset.sig=sig}}
 }
 const v=readForm(fields);
 for(const f of fields)if(f.showIf){const lab=$('#dlg [data-f="'+f.k+'"]');lab.hidden=!f.showIf(v)}
 if(key==='purchases'){
  const isCount=unitOf(v.materialId)==='count';
  const kgLab=$('#dlg [data-f="kg"] span');if(kgLab)kgLab.textContent=(isCount?'تعداد خریداری‌شده (عدد)':'مقدار خریداری‌شده (kg)')+' *';
  const priceLab=$('#dlg [data-f="price"] span');if(priceLab)priceLab.textContent=(isCount?'قیمت هر عدد (تومان)':'قیمت هر کیلو (تومان)')+' *';
 }
 const p=ENT[key].preview(v,row);const box=$('#prev');
 if(p.length){box.hidden=false;box.innerHTML=p.map(([l,x])=>`<div><span>${l}</span><b>${x}</b></div>`).join('')}else box.hidden=true;
}
async function submitForm(){
 if(!guardEdit())return;
 const{key,id,row,fields}=cur;const E=ENT[key];const v=readForm(fields);
 for(const f of fields){if(f.showIf&&!f.showIf(v))continue;if(f.req&&(v[f.k]===''||v[f.k]==null)){$('#err').textContent=`«${f.l}» را کامل کنید.`+(f.t==='date'?' (تاریخ شمسی مثل ۱۴۰۵/۰۶/۱۵)':'');return}}
 const msg=E.validate(v,row);if(msg){$('#err').textContent=msg;return}

/* ======== اتصال آنلاین (Firebase) و هویت کاربر ======== */
function safeParseConfig(text){
 let m=String(text).match(/\{[^{}]*apiKey[^{}]*\}/);
 if(!m)m=String(text).match(/\{[\s\S]*\}/);
 if(!m)throw new Error('no-object');
 const obj=new Function('return ('+m[0]+')')();
 if(!obj||!obj.apiKey||!obj.projectId)throw new Error('missing-fields');
 return obj;
}
async function fbInit(config){
 const appMod=await import('https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js');
 const fsMod=await import('https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js');
 const app=appMod.initializeApp(config);
 const db=fsMod.getFirestore(app);
 FB.mod=fsMod;FB.db=db;
 function docRef(path){
  const ref=fsMod.doc(db,path);
  return{
   id:ref.id,
   async get(){const s=await fsMod.getDoc(ref);return{exists:s.exists(),data:()=>s.data()}},
   async set(data){await fsMod.setDoc(ref,data)},
   async delete(){await fsMod.deleteDoc(ref)},
   onSnapshot(next,err){return fsMod.onSnapshot(ref,s=>next({exists:s.exists(),data:()=>s.data(),id:s.id}),err)}
  };
 }
 function colRef(path,constraints){
  constraints=constraints||[];
  const base=fsMod.collection(db,path);
  return{
   async add(data){const r=fsMod.doc(base);await fsMod.setDoc(r,data);return{id:r.id}},
   orderBy(field,dir){return colRef(path,[...constraints,fsMod.orderBy(field,dir||'asc')])},
   limit(n){return colRef(path,[...constraints,fsMod.limit(n)])},
   onSnapshot(next,err){
    const q=constraints.length?fsMod.query(base,...constraints):base;
    return fsMod.onSnapshot(q,snap=>next({docs:snap.docs.map(d=>({id:d.id,data:()=>d.data()}))}),err);
   }
  };
 }
 return{doc:docRef,collection:colRef};
}
